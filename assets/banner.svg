<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="380">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1145" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Filters for text shadow -->
    <filter id="shadowTitle" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="shadowSubtitle" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <style>
      .banner-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .banner-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .banner-tag {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'SF Pro Text', monospace;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Background Grid -->
  <rect width="1200" height="380" rx="20" fill="url(#gridPattern)" />

  <!-- Ambient Dynamic Glowing Circles -->
  <circle cx="240" cy="120" r="160" fill="url(#glowGrad1)">
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="960" cy="220" r="180" fill="url(#glowGrad2)">
    <animate attributeName="opacity" values="0.65;0.35;0.65" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Network Circuit Lines (Subtle in background) -->
  <g stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5" fill="none">
    <path d="M 600 75 Q 400 40 240 70" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M 600 75 Q 800 40 960 70" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M 600 75 Q 350 110 150 140" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite" />
    </path>
    <path d="M 600 75 Q 850 110 1050 140" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="2.5s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Central Hub / Dynamic Beacon -->
  <g id="hub" transform="translate(600, 75)">
    <!-- Pulse Rings -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#818cf8" stroke-width="2">
      <animate attributeName="r" values="24;54" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5">
      <animate attributeName="r" values="24;54" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="2.8s" begin="1.4s" repeatCount="indefinite" />
    </circle>
    
    <!-- Central Node Core -->
    <circle cx="0" cy="0" r="26" fill="#1e1b4b" stroke="url(#accentGrad)" stroke-width="2.5" />
    
    <!-- Bell Icon in Central Node -->
    <path d="M-6 4 A 7 7 0 0 1 6 4 L 7 7 L -7 7 Z M -2 7 A 2 2 0 0 0 2 7 M -0.5 -4 L -0.5 -6 A 1 1 0 0 1 0.5 -6 L 0.5 -4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Dynamic Floating Channel Badges (Flanking the sides, staying out of title zone) -->
  <!-- Left Side Badges -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="90 60; 90 53; 90 60" dur="4s" repeatCount="indefinite" />
    <rect width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#38bdf8" />
    <text x="34" y="21" fill="#e2e8f0" class="banner-tag">⚡ Push / APNs</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="60 130; 60 136; 60 130" dur="4.5s" repeatCount="indefinite" />
    <rect width="145" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#818cf8" />
    <text x="34" y="21" fill="#e2e8f0" class="banner-tag">✉️ Email / SMTP</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="100 200; 100 193; 100 200" dur="5s" repeatCount="indefinite" />
    <rect width="140" height="34" rx="17" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#c084fc" />
    <text x="34" y="21" fill="#e2e8f0" class="banner-tag">💬 In-App Inbox</text>
  </g>

  <!-- Right Side Badges -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="980 60; 980 66; 980 60" dur="4.5s" repeatCount="indefinite" />
    <rect width="130" height="34" rx="17" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#34d399" />
    <text x="34" y="21" fill="#e2e8f0" class="banner-tag">📱 SMS &amp; Chat</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="995 130; 995 123; 995 130" dur="4s" repeatCount="indefinite" />
    <rect width="145" height="34" rx="17" fill="url(#cardGrad)" stroke="#fb923c" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#fb923c" />
    <text x="34" y="21" fill="#e2e8f0" class="banner-tag">🪝 Webhook Bus</text>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" values="960 200; 960 206; 960 200" dur="4.8s" repeatCount="indefinite" />
    <rect width="150" height="34" rx="17" fill="url(#cardGrad)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#f472b6" />
    <text x="34" y="21" fill="#e2e8f0" class="banner-tag">🛡️ Self-Hosted Hub</text>
  </g>

  <!-- FOREGROUND: Main Title and Subtitles (Positioned clearly in center foreground) -->
  <g transform="translate(600, 195)">
    <!-- Category Pill -->
    <rect x="-140" y="-45" width="280" height="26" rx="13" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
    <text x="0" y="-28" text-anchor="middle" fill="#a5b4fc" class="banner-tag" letter-spacing="1">CURATED DEVELOPER DIRECTORY</text>

    <!-- Main Title with Gradient and Contrast Shadow -->
    <text x="0" y="22" text-anchor="middle" fill="url(#accentGrad)" font-size="42" class="banner-title" filter="url(#shadowTitle)">
      Awesome Notification Infrastructure
    </text>

    <!-- Secondary Line -->
    <text x="0" y="62" text-anchor="middle" fill="#cbd5e1" font-size="16.5" class="banner-subtitle" filter="url(#shadowSubtitle)">
      Multi-Channel Orchestration • In-App Inboxes • Push Servers • Delivery Observability
    </text>

    <!-- Feature Highlights / Specs -->
    <g transform="translate(0, 108)">
      <rect x="-310" y="-18" width="620" height="32" rx="16" fill="#0f172a" fill-opacity="0.85" stroke="#94a3b8" stroke-opacity="0.2" stroke-width="1" />
      <text x="0" y="3" text-anchor="middle" fill="#94a3b8" font-size="13" class="banner-subtitle">
        🚀 <tspan fill="#f8fafc" font-weight="600">SaaS Giants &amp; Startups</tspan> &#160;|&#160; 
        🔓 <tspan fill="#f8fafc" font-weight="600">Open-Source Engines</tspan> &#160;|&#160; 
        📊 <tspan fill="#f8fafc" font-weight="600">Pricing &amp; Star Rankings</tspan>
      </text>
    </g>
  </g>
</svg>
